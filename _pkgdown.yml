url: https://radiationsafety.github.io/BSSUnfoldR/
template:
  bootstrap: 5
  light-switch: true

home:
  title: Neutron spectrum unfolding for Bonner Sphere Spectrometers
  description: |
    R port of the Python bssunfold package — unfolding neutron spectra from
    Bonner sphere measurements, with Monte-Carlo uncertainty and ICRP-74/116
    dose-rate calculation.

reference:
  - title: Detector object
    desc: R6 class bundling energy grid, sensitivities, conversion coefficients and result history.
    contents:
      - Detector
  - title: Unfolding algorithms (batch 1)
    desc: Each algorithm has a `solve_<method>()` raw solver and an `unfold_<method>()` workflow wrapper.
    contents:
      - solve_mlem
      - unfold_mlem
      - solve_gravel
      - unfold_gravel
      - solve_maxed
      - unfold_maxed
      - solve_sandii
      - unfold_sandii
      - solve_bunki
      - unfold_bunki
      - solve_ferdor
      - unfold_ferdor
      - solve_staysl
      - unfold_staysl
      - solve_landweber
      - unfold_landweber
      - solve_cgls
      - unfold_cgls
      - solve_tsvd
      - unfold_tsvd
  - title: Unfolding algorithms (batch 2)
    desc: Ordered-subset, MAP-EM, Krylov-subspace, regularised EM, row-action methods.
    contents:
      - solve_osem
      - unfold_osem
      - solve_mapem
      - unfold_mapem
      - solve_bsrem
      - unfold_bsrem
      - solve_sart
      - unfold_sart
      - solve_kaczmarz
      - unfold_kaczmarz
      - solve_randomized_kaczmarz
      - unfold_randomized_kaczmarz
      - solve_lanczos
      - unfold_lanczos
      - solve_tikhonov_legendre
      - unfold_tikhonov_legendre
      - solve_rebunki
      - unfold_rebunki
      - solve_doroshenko
      - unfold_doroshenko
  - title: Nearest-neighbour priors
    desc: Penalised-EM priors shared by MAP-EM and BSREM.
    contents:
      - prior_gradient
      - prior_value
  - title: Unfolding algorithms (batch 3)
    desc: Bayesian / regularized / Krylov / direct methods.
    contents:
      - solve_bayes
      - unfold_bayes
      - solve_directed_divergence
      - unfold_directed_divergence
      - solve_express
      - unfold_express
      - solve_iterative_refinement
      - unfold_iterative_refinement
      - solve_bunkiut
      - unfold_bunkiut
      - solve_mlem_stop
      - unfold_mlem_stop
      - solve_statreg
      - unfold_statreg
      - solve_tikhonov_tv
      - unfold_tikhonov_tv
      - solve_gks
      - unfold_gks
      - solve_crystal_ball
      - unfold_crystal_ball
  - title: Unfolding algorithms (batch 4)
    desc: Newton / FISTA / B-spline / catalogue / Bayesian MCMC / ensemble.
    contents:
      - solve_imaxed
      - unfold_imaxed
      - solve_amaxed
      - unfold_amaxed
      - solve_fista
      - unfold_fista
      - solve_bayes_spline
      - unfold_bayes_spline_regularization
      - solve_nsduaz
      - unfold_nsduaz
      - builtin_catalogue
      - select_catalogue_initial
      - solve_mlem_bs
      - unfold_mlem_bs
      - build_bspline_basis
      - second_difference_matrix
      - ks_statistic
      - solve_nspline
      - unfold_nspline
      - auto_knots
      - build_continuity_matrix
      - solve_bayesian_mcmc
      - unfold_mcmc
      - solve_reconst
      - unfold_reconst
      - solve_ensemble
      - unfold_ensemble
      - solve_cascade
      - unfold_cascade
      - solve_composite
      - unfold_composite
  - title: Unified unfolding pipeline
    desc: The shared workflow every `unfold_*` method plugs into.
    contents:
      - run_unfolding
      - make_solve_wrapper
  - title: Monte-Carlo uncertainty
    contents:
      - monte_carlo_uncertainty
  - title: Dose-rate calculation
    contents:
      - calculate_dose_rates
      - get_coefficients
      - interpolate_coefficients
      - DOSE_COEFFICIENTS_REGISTRY
  - title: Built-in constants
    desc: Accessors for ICRP / NRB99 / response-function datasets (numeric data is generated verbatim from the Python bssunfold constants module).
    contents:
      - ICRP116_COEFF_EFFECTIVE_DOSE
      - ICRP74_COEFF_EFFECTIVE_DOSE
      - NRB99_2009_COEFF_EFFECTIVE_DOSE
      - ICRP74_COEFF_OPERATIONAL_QUANTITIES
      - RF_GSF
      - RF_PTB
      - RF_LANL
      - RF_JINR
      - RF_FERMILAB
      - RF_EURADOS
      - RF_IHEP
  - title: Matrix utilities
    contents:
      - create_derivative_matrix
      - make_regularization_operator
      - build_tikhonov_system
      - compute_svd_components
      - compute_log_steps
  - title: Input validators
    contents:
      - validate_readings
      - validate_energy_grid
      - validate_spectrum
      - validate_response_matrix
      - validate_system

articles:
  - title: Getting started
    contents:
      - quickstart

news:
  - title: BSSUnfoldR changelog
    text: |
      # BSSUnfoldR 0.1.0

      * First CRAN-style release.
      * Detector R6 class wrapping PTB / GSF / LANL / JINR / FERMILAB / EURADOS / IHEP response functions.
      * Ten classic unfolding algorithms: MLEM, GRAVEL, MAXED, SAND-II, BUNKI, FERDOR, STAY'SL, Landweber, CGLS, TSVD.
      * Monte-Carlo uncertainty estimation via `monte_carlo_uncertainty()`.
      * Dose-rate calculation using ICRP-74, ICRP-116 and NRB99-2009 coefficients.
      * R CMD check: Status OK (no ERROR/WARNING/NOTE).
